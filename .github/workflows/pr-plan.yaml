name: Terraform PR Plan & Cost Preview

on:
  workflow_dispatch:
    inputs:
      payment_option:
        description: 'Reserved Instance Payment Option (Manual Run)'
        type: choice
        default: 'no_upfront'
        options:
          - 'no_upfront'
          - 'partial_upfront'
          - 'all_upfront'

  pull_request:
    branches:
      - main
    paths:
      - '**.tf'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ==========================================
  # JOB 1: Format & Syntax Check (Reusable)
  # ==========================================
  call-format-validate:
    uses: ./.github/workflows/code-check.yaml

  # ==========================================
  # JOB 2: AWS Login + Plan + Complete FinOps Report
  # ==========================================
  terraform-plan:
    needs: call-format-validate
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ARN_DEVOPS }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan -no-color -out=tfplan.binary > plan.txt
          terraform show -json tfplan.binary > plan.json
          cat plan.txt

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const body = `### Terraform Plan Output 📋\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Complete FinOps Matrix & Resource Breakdown
        run: |
          # 1. Plan JSON se saare EC2 aur RDS instances automatically detect karein
          EC2_LIST=$(jq -r '[.. | objects | select(.type? == "aws_instance") | .address] | unique[]' plan.json)
          RDS_LIST=$(jq -r '[.. | objects | select(.type? == "aws_db_instance") | .address] | unique[]' plan.json)

          # Helper function: Term aur Payment option ke hisab se total monthly cost nikalne ke liye
          calc_cost() {
            TERM=$1
            PAY=$2
            echo "version: 0.1" > /tmp/usage.yml
            echo "resource_usage:" >> /tmp/usage.yml

            for inst in $EC2_LIST; do
              echo "  $inst:" >> /tmp/usage.yml
              echo "    operating_system: linux" >> /tmp/usage.yml
              if [ "$TERM" != "on_demand" ]; then
                echo "    reserved_instance_type: standard" >> /tmp/usage.yml
                echo "    reserved_instance_term: $TERM" >> /tmp/usage.yml
                echo "    reserved_instance_payment_option: $PAY" >> /tmp/usage.yml
              fi
            done

            for db in $RDS_LIST; do
              echo "  $db:" >> /tmp/usage.yml
              if [ "$TERM" != "on_demand" ]; then
                echo "    reserved_instance_term: $TERM" >> /tmp/usage.yml
                echo "    reserved_instance_payment_option: $PAY" >> /tmp/usage.yml
              fi
            done

            infracost breakdown --path=plan.json --usage-file=/tmp/usage.yml --format=json --out-file=/tmp/ic_out.json >/dev/null
            jq -r '.totalMonthlyCost | tonumber' /tmp/ic_out.json
          }

          # 2. On-Demand Baseline Cost (All Resources)
          OD_MO=$(calc_cost "on_demand" "none")
          OD_1Y=$(awk "BEGIN {printf \"%.2f\", $OD_MO * 12}")
          OD_3Y=$(awk "BEGIN {printf \"%.2f\", $OD_MO * 36}")

          # 3. No Upfront (1-Yr & 3-Yr)
          NU_1Y_MO=$(calc_cost "1_yr" "no_upfront")
          NU_1Y_TOT=$(awk "BEGIN {printf \"%.2f\", $NU_1Y_MO * 12}")
          NU_3Y_MO=$(calc_cost "3_yr" "no_upfront")
          NU_3Y_TOT=$(awk "BEGIN {printf \"%.2f\", $NU_3Y_MO * 36}")

          # 4. Partial Upfront (1-Yr & 3-Yr)
          PU_1Y_MO=$(calc_cost "1_yr" "partial_upfront")
          PU_1Y_TOT=$(awk "BEGIN {printf \"%.2f\", $PU_1Y_MO * 12}")
          PU_3Y_MO=$(calc_cost "3_yr" "partial_upfront")
          PU_3Y_TOT=$(awk "BEGIN {printf \"%.2f\", $PU_3Y_MO * 36}")

          # 5. All Upfront (1-Yr & 3-Yr)
          AU_1Y_MO=$(calc_cost "1_yr" "all_upfront")
          AU_1Y_TOT=$(awk "BEGIN {printf \"%.2f\", $AU_1Y_MO * 12}")
          AU_3Y_MO=$(calc_cost "3_yr" "all_upfront")
          AU_3Y_TOT=$(awk "BEGIN {printf \"%.2f\", $AU_3Y_MO * 36}")

          pct() {
            awk "BEGIN { if ($1 > 0) printf \"%.0f%%\", (($1 - $2) / $1) * 100; else print \"0%\" }"
          }

          # 6. Complete Markdown Report Taiyar Karein
          cat <<EOF > /tmp/finops_report.md
          ### 💰 Complete AWS Cost & Savings Matrix (All Resources)

          #### 1. Baseline: On-Demand (No Commitment)
          | Plan | Monthly Cost | 1-Year Total (12 Mo) | 3-Year Total (36 Mo) |
          | :--- | :--- | :--- | :--- |
          | **On-Demand** | **\$$(printf "%.2f" $OD_MO)** | \$$OD_1Y | \$$OD_3Y |

          ---

          #### 2. Payment Option: \`no_upfront\` (Zero Upfront Payment)
          | Commitment Term | Effective Monthly | Total Term Cost | Total Savings vs On-Demand |
          | :--- | :--- | :--- | :--- |
          | **1-Year Reserved** | \$$(printf "%.2f" $NU_1Y_MO)/mo | **\$$NU_1Y_TOT** (12 mo) | Save \$$(awk "BEGIN {printf \"%.2f\", $OD_1Y - $NU_1Y_TOT}") ($(pct $OD_1Y $NU_1Y_TOT)) |
          | **3-Year Reserved** | \$$(printf "%.2f" $NU_3Y_MO)/mo | **\$$NU_3Y_TOT** (36 mo) | Save \$$(awk "BEGIN {printf \"%.2f\", $OD_3Y - $NU_3Y_TOT}") ($(pct $OD_3Y $NU_3Y_TOT)) |

          ---

          #### 3. Payment Option: \`partial_upfront\` (Part Upfront + Discounted Monthly)
          | Commitment Term | Effective Monthly | Total Term Cost | Total Savings vs On-Demand |
          | :--- | :--- | :--- | :--- |
          | **1-Year Reserved** | \$$(printf "%.2f" $PU_1Y_MO)/mo | **\$$PU_1Y_TOT** (12 mo) | Save \$$(awk "BEGIN {printf \"%.2f\", $OD_1Y - $PU_1Y_TOT}") ($(pct $OD_1Y $PU_1Y_TOT)) |
          | **3-Year Reserved** | \$$(printf "%.2f" $PU_3Y_MO)/mo | **\$$PU_3Y_TOT** (36 mo) | Save \$$(awk "BEGIN {printf \"%.2f\", $OD_3Y - $PU_3Y_TOT}") ($(pct $OD_3Y $PU_3Y_TOT)) |

          ---

          #### 4. Payment Option: \`all_upfront\` (Maximum Discount)
          | Commitment Term | Effective Monthly | Total Term Cost | Total Savings vs On-Demand |
          | :--- | :--- | :--- | :--- |
          | **1-Year Reserved** | \$$(printf "%.2f" $AU_1Y_MO)/mo | **\$$AU_1Y_TOT** (12 mo) | Save \$$(awk "BEGIN {printf \"%.2f\", $OD_1Y - $AU_1Y_TOT}") ($(pct $OD_1Y $AU_1Y_TOT)) |
          | **3-Year Reserved** | \$$(printf "%.2f" $AU_3Y_MO)/mo | **\$$AU_3Y_TOT** (36 mo) | Save \$$(awk "BEGIN {printf \"%.2f\", $OD_3Y - $AU_3Y_TOT}") ($(pct $OD_3Y $AU_3Y_TOT)) |
          EOF

          # 7. Individual Resource-by-Resource Cost Table Append Karein
          infracost breakdown --path=plan.json --format=table > /tmp/resource_table.txt
          echo -e "\n---\n\n#### 5. Resource-by-Resource Breakdown (All AWS Services)\n\`\`\`text\n$(cat /tmp/resource_table.txt)\n\`\`\`" >> /tmp/finops_report.md

          cat /tmp/finops_report.md

          # 8. Agar PR hai toh comment post karein
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/finops_report.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
