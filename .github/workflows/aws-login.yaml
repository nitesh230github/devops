name: AWS OIDC Secure Login Test

on:
  workflow_dispatch:

permissions:
  id-token: write   # GitHub se OIDC JWT token generate karne ke liye
  contents: read    # Repo code checkout karne ke liye

jobs:
  aws-login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ARN_DEVOPS }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity
