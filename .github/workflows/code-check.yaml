name : terraform code & format check

on:
  workflow_call:
   
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action (fmt -check or validate)'
        type: choice
        default: 'fmt -check'
        options:
          - 'fmt -check'
          - 'validate' 

  push:
    branches:
      - main
    paths:
      - '**.tf'     

jobs:
  terraform-check:    
  
    runs-on: ubuntu-latest

    steps:
    - name: Code checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false

    - name: Terraform Action (sirf mannual run me hi chalega)
      if: github.event_name == 'workflow_dispatch'  
      run: |
        if [ "${{ github.event.inputs.action }}" = "validate" ]; then
          terraform init 
        fi
        echo "=== checked files ==="
        STATUS=0
        for file in $(find . -name "*.tf" -not -path "./.terraform/*"); do
          echo "Checking: $file"
          terraform fmt -check -diff "$file" || STATUS=1
        done
        exit $STATUS
        terraform ${{ github.event.inputs.action }} 
        

    - name: Terraform Format Check (sirf push me chalega)
      if: github.event_name == 'push'
      run: | 
          echo "=== All .tf files in repository ==="
          find . -name "*.tf"
          echo "=== checked files ==="
          STATUS=0
          for file in $(find . -name "*.tf" -not -path "./.terraform/*"); do
            echo "Checking: $file"
            terraform fmt -check -diff "$file" || STATUS=1
          done
          exit $STATUS
          
          
      
# -list=true -diff lagane se agar kisi file mein formatting ki galti hogi,
# toh logs mein exact line-by-line diff (kya galat hai aur kya hona chahiye) bhi dikh jayega!
# Note: -not -path "./.terraform/*" isliye lagaya hai taaki agar .terraform cache folder exist kare toh uske andar ki provider files scan na hon.
